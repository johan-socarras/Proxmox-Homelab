# The DEVICESCAN line of /etc/smartd.conf on pve01 (the rest of the file is the Debian default).
# -C 197+ / -U 198+: alert only when pending or offline-uncorrectable sectors increase.
# -R 5!: alert when the reallocated sector count changes.
DEVICESCAN -d removable -n standby -H -f -t -l error -l selftest -l selfteststs -C 197+ -U 198+ -R 5! -m root -M exec /usr/share/smartmontools/smartd-runner
