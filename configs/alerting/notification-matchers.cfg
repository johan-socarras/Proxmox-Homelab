# The two matchers in /etc/pve/notifications.cfg. Both targets are webhooks to ntfy (CT 106);
# their URL, headers and body are left out because they carry the topic and a token.
matcher: default-matcher
	comment Routine notifications (info, notice) to ntfy, low priority
	match-severity info,notice
	mode all
	target ntfy

matcher: serious-alerts
	comment Warnings, errors and root mail (unknown severity, e.g. smartd) to ntfy-urgent, high priority
	match-severity warning,error,unknown
	target ntfy-urgent
