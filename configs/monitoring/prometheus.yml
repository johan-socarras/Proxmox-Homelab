# Home lab: Prometheus in CT 107 (prometheus.lan).
# Scrapes itself and Proxmox VE (pve01) through prometheus-pve-exporter, which runs on this container
# on 127.0.0.1:9221 with the read-only API token prometheus@pve!exporter.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['<lan>.10']
        labels:
          node_name: pve01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9221
