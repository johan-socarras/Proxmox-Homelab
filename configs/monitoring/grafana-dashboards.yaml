# Dashboards kept as files in /var/lib/grafana/dashboards (CT 108: /etc/grafana/provisioning/dashboards/homelab.yaml).
apiVersion: 1
providers:
  - name: homelab
    folder: Home lab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
