# Remote syslog from the home router (<lan>.1), written to /var/log/router/router.log.
# Timestamps are the reception time: the router's clock is wrong after a reboot until NTP syncs.
module(load="imudp")
template(name="RouterFmt" type="string" string="%timegenerated:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
ruleset(name="router") {
  if $fromhost-ip == "<lan>.1" then {
    action(type="omfile" file="/var/log/router/router.log" template="RouterFmt")
  }
  stop
}
input(type="imudp" port="514" ruleset="router")
