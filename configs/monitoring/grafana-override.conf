# Home lab: Grafana in CT 108 (grafana.lan). Settings as environment variables so the packaged grafana.ini stays untouched.
[Service]
Environment=GF_SERVER_DOMAIN=grafana.lan
Environment=GF_SERVER_ROOT_URL=https://grafana.lan/
# Nothing leaves the home network: no usage reports, update checks, news or plugin preinstalls.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_PLUGINS_PREINSTALL_DISABLED=true
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
# Anyone on the LAN can look at the dashboards; changing them needs the admin login.
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/proxmox.json
