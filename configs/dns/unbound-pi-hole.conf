# Unbound as a local recursive resolver for Pi-hole (Pi-hole upstream: 127.0.0.1#5335).
# Based on the Pi-hole guide: https://docs.pi-hole.net/guides/dns/unbound/
server:
    verbosity: 0

    # Only Pi-hole, inside this container, can reach it.
    interface: 127.0.0.1
    port: 5335

    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # The LAN has no IPv6 (disabled on the router).
    do-ip6: no
    prefer-ip6: no

    # DNSSEC validation; the root trust anchor comes from the Debian package.
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no

    # Avoid UDP fragmentation (DNS Flag Day 2020).
    edns-buffer-size: 1232

    # Refresh popular entries before they expire.
    prefetch: yes

    num-threads: 1

    # Never return private addresses for public names (DNS rebinding protection).
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # Never return documentation or broadcast addresses for public names either.
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
    private-address: 2001:db8::/32

    qname-minimisation: no
